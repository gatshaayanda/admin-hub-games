name: Build Wardrobe Generated Player Assets
# Keep this workflow independently triggerable after installation on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Extract transparent Phaser assets
        run: python scripts/wardrobe/extract-generated-player-2.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/wardrobe/generated-v2
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "assets: generate transparent Wardrobe player v2"
          git push origin HEAD:main
