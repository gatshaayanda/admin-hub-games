name: Prepare Wardrobe Generated Assets

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/wardrobe/incoming/1.jpg'
      - 'public/assets/wardrobe/incoming/og.jpg'
      - 'scripts/prepare-wardrobe-assets.py'
      - '.github/workflows/wardrobe-assets.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build transparent player assets
        run: python scripts/prepare-wardrobe-assets.py
      - name: Commit generated assets
        run: |
          if git diff --quiet -- public/assets/wardrobe/generated; then
            echo "Generated assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/wardrobe/generated
          git commit -m "Generate transparent Wardrobe player assets"
          git push
